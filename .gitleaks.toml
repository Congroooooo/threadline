# Secret scan configuration (CI: gitleaks/gitleaks-action). The default rules apply; the
# only exceptions are the obviously fake values that the redaction tests and the plan use
# to prove that secrets are scrubbed. Allow exact fake values here, never whole files.
[extend]
useDefault = true

[allowlist]
description = "Fake secrets used as redaction test fixtures"
regexTarget = "match"
regexes = [
  '''glpat-abcdefghij(klmnopqrst|0123456789)''',
  '''AKIAABCDEFGHIJKLMNOP''',
  '''FakePassw0rd1''',
  '''FakePassw0rd2''',
  '''FakePassw0rd3''',
  '''github_pat_11FAKEFAKE0123456789_abcdefghijklmnopqrstuvwxyz''',
  '''sk\-ant\-api03\-fakefakefakefakefake0123''',
  '''sk\-proj\-fakefakefakefakefake4567''',
  '''fakeclientsecret0123''',
  '''tl_fake0123456789abcdef''',
  '''https://hooks\.slack\.com/services/T00000000/B00000000/FAKEFAKEFAKEFAKEFAKEFAKE''',
  '''fakesecret01''',
  '''fakeprivate02''',
  '''fakesecret03''',
  '''fakeaccess04''',
  '''fakerefresh05''',
  '''MIIfakefakefake''',
  '''fakeaccess06''',
  '''fakeapikey07''',
  '''sk\-fakefakefakefakefake8901''',
  '''fakeghs0123456789''',
]
